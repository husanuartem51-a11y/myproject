<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusChain — Трекер фокуса</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e2e; color: #cdd6f4; text-align: center; padding: 50px; margin: 0; }
        .card { background: #252538; padding: 30px; border-radius: 12px; max-width: 350px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid #45475a; }
        h2 { color: #89b4fa; margin-top: 0; }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; font-size: 14px; }
        input:focus { outline: none; border-color: #89b4fa; }
        input.input-error { border-color: #f38ba8; }
        .error-box { min-height: 20px; font-size: 13px; color: #f38ba8; margin-bottom: 10px; text-align: left; }
        .status { font-size: 18px; margin: 14px 0; font-weight: bold; color: #fab387; word-break: break-word; }
        .counter { font-size: 14px; margin-top: 15px; color: #a6adc8; border-top: 1px solid #45475a; padding-top: 15px; }
        button { background: #89b4fa; color: #11111b; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; width: 100%; }
        button:hover { background: #b4befe; }
        button.active { background: #f38ba8; color: #11111b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>FocusChain ⚡</h2>
        <p>Инструмент для удержания концентрации</p>
        <input type="text" id="goalInput" placeholder="Введите цель сессии (до 50 симв.)..." />
        <div class="error-box" id="errorBox" role="alert"></div>
        <div class="status" id="statusText">Статус: Отдых ☕</div>
        <button id="focusBtn">Начать сессию фокуса</button>
        <div class="counter" id="counterText">Завершено сессий: 0</div>
    </div>

    <script>
        const STORAGE_KEY = 'focusChainState';
        const MAX_GOAL_LENGTH = 50;

        const button = document.getElementById('focusBtn');
        const statusText = document.getElementById('statusText');
        const counterText = document.getElementById('counterText');
        const goalInput = document.getElementById('goalInput');
        const errorBox = document.getElementById('errorBox');

        let state = {
            completedSessions: 0,
            isFocusing: false,
            goal: ''
        };

        function showError(message) {
            errorBox.textContent = message;
            goalInput.classList.add('input-error');
        }

        function clearError() {
            errorBox.textContent = '';
            goalInput.classList.remove('input-error');
        }

        function loadState() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
                render();
                return;
            }

            try {
                const parsed = JSON.parse(raw);
                const isValidCount = typeof parsed.completedSessions === 'number'
                    && Number.isInteger(parsed.completedSessions)
                    && parsed.completedSessions >= 0;
                const isValidFlag = typeof parsed.isFocusing === 'boolean';
                const isValidGoal = typeof parsed.goal === 'string';

                if (!isValidCount || !isValidFlag || !isValidGoal) {
                    throw new Error('Некорректная структура сохранённых данных');
                }

                state = {
                    completedSessions: parsed.completedSessions,
                    isFocusing: parsed.isFocusing,
                    goal: parsed.goal
                };
            } catch (err) {
                state = { completedSessions: 0, isFocusing: false, goal: '' };
                saveState();
                showError('Ошибка чтения сохранения: повреждённые данные сброшены.');
            }

            render();
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (err) {
                showError('Не удалось сохранить данные в браузере.');
            }
        }

        function validateGoal(rawValue) {
            const trimmed = rawValue.trim();
            if (trimmed.length === 0) {
                return { ok: false, error: 'Ошибка: введите цель сессии перед запуском.' };
            }
            if (trimmed.length > MAX_GOAL_LENGTH) {
                return { ok: false, error: `Ошибка: цель слишком длинная (максимум ${MAX_GOAL_LENGTH} символов).` };
            }
            return { ok: true, value: trimmed };
        }

        function render() {
            goalInput.value = state.goal;
            counterText.textContent = `Завершено сессий: ${state.completedSessions}`;

            if (state.isFocusing) {
                button.classList.add('active');
                button.textContent = 'Завершить фокус';
                statusText.textContent = `В фокусе: ${state.goal} 🎯`;
                statusText.style.color = '#a6e3a1';
                goalInput.disabled = true;
            } else {
                button.classList.remove('active');
                button.textContent = 'Начать сессию фокуса';
                statusText.textContent = 'Статус: Отдых ☕';
                statusText.style.color = '#fab387';
                goalInput.disabled = false;
            }
        }

        goalInput.addEventListener('input', () => {
            if (errorBox.textContent) {
                clearError();
            }
        });

        button.addEventListener('click', () => {
            if (!state.isFocusing) {
                const validation = validateGoal(goalInput.value);
                if (!validation.ok) {
                    showError(validation.error);
                    return;
                }
                clearError();
                state.goal = validation.value;
                state.isFocusing = true;
            } else {
                clearError();
                state.isFocusing = false;
                state.completedSessions += 1;
            }
            saveState();
            render();
        });

        loadState();
    </script>
</body>
</html>
