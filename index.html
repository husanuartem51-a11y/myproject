<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusChain — Трекер фокуса</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e2e; color: #cdd6f4; text-align: center; padding: 40px 16px; margin: 0; }
        .card { background: #252538; padding: 28px; border-radius: 14px; max-width: 380px; margin: 0 auto; box-shadow: 0 8px 24px rgba(0,0,0,0.35); border: 1px solid #45475a; }
        h2 { color: #89b4fa; margin: 0 0 6px; }
        .subtitle { color: #a6adc8; font-size: 14px; margin: 0 0 18px; }
        input { width: 100%; box-sizing: border-box; padding: 11px 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; font-size: 14px; }
        input:focus { outline: none; border-color: #89b4fa; }
        input.input-error { border-color: #f38ba8; }
        .error-box { min-height: 20px; font-size: 13px; color: #f38ba8; margin-bottom: 10px; text-align: left; }
        .status { font-size: 17px; margin: 10px 0 4px; font-weight: bold; color: #fab387; word-break: break-word; }
        .timer { font-size: 28px; font-weight: bold; color: #cdd6f4; margin: 6px 0 16px; }
        .btn-main { background: #89b4fa; color: #11111b; border: none; padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn-main:hover { background: #b4befe; }
        .btn-main.active { background: #f38ba8; }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-top: 18px; color: #a6adc8; border-top: 1px solid #45475a; padding-top: 14px; }
        .btn-reset { background: transparent; color: #f38ba8; border: 1px solid #45475a; padding: 5px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .history { margin-top: 14px; text-align: left; }
        .history-item { background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 8px 12px; margin-top: 6px; font-size: 13px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="card">
        <h2>FocusChain ⚡</h2>
        <p class="subtitle">Трекер концентрации</p>
        <input type="text" id="goalInput" placeholder="Введите цель сессии (до 50 симв.)..." />
        <div class="error-box" id="errorBox"></div>
        <div class="status" id="statusText">Статус: Отдых ☕</div>
        <div class="timer" id="timerText">00:00</div>
        <button type="button" class="btn-main" id="focusBtn">Начать сессию фокуса</button>
        <div class="stats-bar">
            <span id="counterText">Завершено сессий: 0</span>
            <button type="button" class="btn-reset" id="resetBtn">Сбросить</button>
        </div>
        <div class="history" id="historyList"></div>
    </div>

    <script>
        const STORAGE_KEY = 'focusChainData_v2';
        const MAX_LEN = 50;

        const goalInput = document.getElementById('goalInput');
        const errorBox = document.getElementById('errorBox');
        const statusText = document.getElementById('statusText');
        const timerText = document.getElementById('timerText');
        const focusBtn = document.getElementById('focusBtn');
        const counterText = document.getElementById('counterText');
        const resetBtn = document.getElementById('resetBtn');
        const historyList = document.getElementById('historyList');

        let timerId = null;
        let state = { count: 0, active: false, goal: '', startedAt: null, history: [] };

        function showError(msg) {
            errorBox.textContent = msg;
            goalInput.classList.add('input-error');
        }

        function clearError() {
            errorBox.textContent = '';
            goalInput.classList.remove('input-error');
        }

        function formatSec(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                showError('Ошибка сохранения в localStorage.');
            }
        }

        function load() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return render();
            try {
                const data = JSON.parse(raw);
                if (typeof data.count !== 'number' || data.count < 0 || typeof data.active !== 'boolean' || typeof data.goal !== 'string' || !Array.isArray(data.history)) {
                    throw new Error('Bad format');
                }
                state = data;
            } catch (e) {
                state = { count: 0, active: false, goal: '', startedAt: null, history: [] };
                save();
                showError('Ошибка чтения сохранения: повреждённые данные сброшены.');
            }
            render();
        }

        function updateClock() {
            if (!state.active || !state.startedAt) {
                timerText.textContent = '00:00';
                return;
            }
            const diff = Math.max(0, Math.floor((Date.now() - state.startedAt) / 1000));
            timerText.textContent = formatSec(diff);
        }

        function render() {
            goalInput.value = state.goal;
            counterText.textContent = `Завершено сессий: ${state.count}`;
            historyList.innerHTML = state.history.slice(0, 5).map(item =>
                `<div class="history-item"><span>${item.goal}</span><span style="color:#a6e3a1">${item.time}</span></div>`
            ).join('');

            clearInterval(timerId);
            if (state.active) {
                focusBtn.classList.add('active');
                focusBtn.textContent = 'Завершить фокус';
                statusText.textContent = `В фокусе: ${state.goal} 🎯`;
                statusText.style.color = '#a6e3a1';
                goalInput.disabled = true;
                updateClock();
                timerId = setInterval(updateClock, 1000);
            } else {
                focusBtn.classList.remove('active');
                focusBtn.textContent = 'Начать сессию фокуса';
                statusText.textContent = 'Статус: Отдых ☕';
                statusText.style.color = '#fab387';
                goalInput.disabled = false;
                timerText.textContent = '00:00';
            }
        }

        focusBtn.addEventListener('click', () => {
            if (!state.active) {
                const text = goalInput.value.trim();
                if (!text) {
                    showError('Ошибка: введите цель сессии перед запуском.');
                    return;
                }
                if (text.length > MAX_LEN) {
                    showError(`Ошибка: цель слишком длинная (максимум ${MAX_LEN} символов).`);
                    return;
                }
                clearError();
                state.goal = text;
                state.active = true;
                state.startedAt = Date.now();
            } else {
                clearError();
                const sec = state.startedAt ? Math.max(1, Math.floor((Date.now() - state.startedAt) / 1000)) : 1;
                state.history.unshift({ goal: state.goal, time: formatSec(sec) });
                state.active = false;
                state.startedAt = null;
                state.count += 1;
            }
            save();
            render();
        });

        resetBtn.addEventListener('click', () => {
            clearError();
            state = { count: 0, active: false, goal: '', startedAt: null, history: [] };
            save();
            render();
        });

        load();
    </script>
</body>
</html>
